<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIBE Recognition — Test Harness</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f0f1a; color: #eee; min-height: 100vh; }

  .shell { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh; }
  .sidebar { background: #1a1a2e; padding: 24px 16px; border-right: 1px solid #2a2a4a; overflow-y: auto; }
  .main { padding: 32px; overflow-y: auto; }

  .sidebar h2 { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #e94560; margin-bottom: 14px; }
  .sidebar-divider { border: none; border-top: 1px solid #2a2a4a; margin: 18px 0; }

  .scenario-btn {
    display: block; width: 100%; text-align: left; padding: 10px 12px;
    background: #2a2a4a; border: 1px solid #3a3a5a; border-radius: 6px;
    color: #ccc; font-size: 13px; cursor: pointer; margin-bottom: 8px; transition: all 0.15s;
  }
  .scenario-btn:hover, .scenario-btn.active { background: #e94560; border-color: #e94560; color: white; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; font-weight: bold; vertical-align: middle; }
  .tag-pass { background: #1a4a2a; color: #4cde80; }
  .tag-fail { background: #4a1a1a; color: #e94560; }
  .tag-warn { background: #4a3a1a; color: #f0a050; }

  .status-bar { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px 16px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot-green { background: #4cde80; box-shadow: 0 0 6px #4cde80; }
  .dot-red { background: #e94560; box-shadow: 0 0 6px #e94560; }
  .dot-yellow { background: #f0a050; box-shadow: 0 0 6px #f0a050; }

  .app-frame { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); min-height: 600px; }
  .frame-bar { background: #2a2a4a; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .d1{background:#e94560} .d2{background:#f0a050} .d3{background:#4cde80}
  .frame-url { flex: 1; background: #1a1a2e; border-radius: 4px; padding: 4px 12px; font-size: 12px; color: #888; margin: 0 8px; }

  /* App internals */
  .vibe-wrap { min-height: 560px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 36px 16px; }
  .vibe-card { background: white; border-radius: 12px; padding: 30px 34px; width: 100%; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .vibe-title { font-family: Georgia, serif; font-size: 20px; margin-bottom: 4px; }
  .vibe-subtitle { font-size: 12px; color: #888; margin-bottom: 22px; }
  .vibe-section { background: #f7f7f7; border-radius: 8px; padding: 16px 16px 4px; margin-bottom: 16px; }
  .vibe-section-label { font-size: 10px; font-weight: bold; color: #aaa; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }
  .vibe-field { margin-bottom: 14px; position: relative; }
  .vibe-label { display: block; font-size: 12px; font-weight: bold; color: #333; margin-bottom: 4px; }
  .vibe-input, .vibe-select, .vibe-textarea { width: 100%; padding: 9px 12px; border: 1.5px solid #ddd; border-radius: 6px; font-size: 13px; font-family: Arial, sans-serif; outline: none; }
  .vibe-input.err, .vibe-select.err, .vibe-textarea.err { border-color: #e94560; }
  .vibe-err { font-size: 11px; color: #e94560; margin-top: 3px; }
  .vibe-btn { width: 100%; padding: 13px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: Arial, sans-serif; transition: opacity 0.15s; }
  .vibe-btn:hover { opacity: 0.88; }
  .vibe-btn-secondary { padding: 12px; border-radius: 8px; font-size: 13px; font-family: Arial, sans-serif; cursor: pointer; background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
  .vibe-footer { font-size: 10px; opacity: 0.3; text-align: center; margin-top: 24px; }

  /* Autocomplete dropdown */
  .autocomplete-list {
    position: absolute; top: 100%; left: 0; right: 0; background: white;
    border: 1.5px solid #ddd; border-top: none; border-radius: 0 0 6px 6px;
    z-index: 100; max-height: 180px; overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .autocomplete-item {
    padding: 9px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f0f0f0;
    transition: background 0.1s;
  }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover, .autocomplete-item.focused { background: #f0f4ff; }
  .autocomplete-item .emp-name { font-weight: bold; color: #333; }
  .autocomplete-item .emp-email { font-size: 11px; color: #888; margin-top: 1px; }
  .autocomplete-item .emp-dept { font-size: 10px; color: #bbb; float: right; margin-top: 2px; }

  /* Email locked badge */
  .email-locked { display: flex; align-items: center; gap: 6px; }
  .lock-badge { font-size: 10px; background: #e8f4e8; color: #2a8a2a; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }

  /* Certificate */
  .cert { background: white; max-width: 640px; margin: 0 auto; padding: 36px 44px; font-family: Georgia, serif; position: relative; }
  .cert-badge { font-size: 9px; font-family: Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; padding: 3px 14px; border-radius: 2px; color: white; display: inline-block; }
  .cert-name { font-size: 34px; font-style: italic; margin: 8px 0 10px; }
  .cert-category { font-size: 11px; font-family: Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; padding: 4px 18px; border-radius: 2px; border: 1px solid; display: inline-block; margin-bottom: 16px; }
  .cert-reason { font-family: Arial, sans-serif; font-size: 13px; line-height: 1.7; font-style: italic; padding: 12px 18px; margin-bottom: 18px; border-left: 4px solid; }

  /* Expired */
  .expired-screen { min-height: 560px; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 40px; }

  /* CSV upload panel */
  .csv-panel { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 14px; margin-top: 12px; }
  .csv-panel textarea { width: 100%; background: #0f0f1a; border: 1px solid #2a2a4a; border-radius: 6px; color: #4cde80; font-family: monospace; font-size: 11px; padding: 10px; resize: vertical; min-height: 90px; }
  .csv-panel button { margin-top: 8px; padding: 7px 14px; background: #e94560; border: none; border-radius: 6px; color: white; font-size: 12px; cursor: pointer; }
  .dir-count { font-size: 11px; color: #4cde80; margin-top: 6px; }

  .mini-btn { padding: 6px 12px; background: #2a2a4a; border: 1px solid #3a3a5a; border-radius: 5px; color: #ccc; font-size: 11px; cursor: pointer; width: 100%; margin-bottom: 6px; }
  .mini-btn:hover { background: #3a3a5a; }
</style>
</head>
<body>
<div class="shell">

  <!-- ── SIDEBAR ─────────────────────────────────────── -->
  <div class="sidebar">
    <h2>Test Scenarios</h2>
    <button class="scenario-btn active" onclick="loadScenario('valid')"     id="btn-valid">    ✓ Valid License    <span class="tag tag-pass">PASS</span></button>
    <button class="scenario-btn"        onclick="loadScenario('expiring')"  id="btn-expiring"> ⚠ Expiring Soon   <span class="tag tag-warn">WARN</span></button>
    <button class="scenario-btn"        onclick="loadScenario('expired')"   id="btn-expired">  ✗ Expired License  <span class="tag tag-fail">FAIL</span></button>
    <button class="scenario-btn"        onclick="loadScenario('brand-b')"   id="btn-brand-b">  🎨 Different Brand  <span class="tag tag-pass">PASS</span></button>

    <hr class="sidebar-divider" />

    <h2>License</h2>
    <div id="license-info" style="font-size:12px;color:#aaa;line-height:1.9;margin-bottom:10px;"></div>
    <button class="mini-btn" onclick="generateNewKey()">⟳ Generate New Key</button>
    <div id="new-key-output" style="font-size:11px;color:#4cde80;word-break:break-all;margin-top:4px;"></div>

    <hr class="sidebar-divider" />

    <h2>Employee Directory</h2>
    <div id="dir-count" class="dir-count"></div>
    <button class="mini-btn" onclick="toggleCSVPanel()">↑ Import CSV</button>
    <div id="csv-panel" style="display:none;" class="csv-panel">
      <div style="font-size:11px;color:#888;margin-bottom:6px;">Paste CSV: name,email,department</div>
      <textarea id="csv-input" placeholder="Sarah Johnson,sarah@acme.com,Marketing&#10;James Lee,james@acme.com,Engineering"></textarea>
      <button onclick="importCSV()">Import</button>
      <button onclick="loadSampleDirectory()" style="margin-left:6px;background:#2a2a4a;">Load Sample</button>
    </div>
  </div>

  <!-- ── MAIN ───────────────────────────────────────── -->
  <div class="main">
    <div class="status-bar" id="status-bar">
      <div class="status-dot dot-green" id="status-dot"></div>
      <div id="status-text">License valid — loading form…</div>
    </div>
    <div class="app-frame">
      <div class="frame-bar">
        <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div>
        <div class="frame-url" id="frame-url">https://recognition.vibeapp.co.uk/nominate/acme-corp</div>
      </div>
      <div id="app-root"></div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════

const scenarios = {
  valid: {
    license: { key: "VIBE-A3F2-9C1D-BE47-2E8A", expiresAt: futureDate(280) },
    brand: {
      slug:"acme-corp", businessName:"Acme Corporation",
      logoUrl:"https://placehold.co/160x48/1a1a2e/ffffff?text=ACME+CORP",
      primaryColor:"#1a1a2e", accentColor:"#e94560",
      tagline:"Recognising the people who make us great",
      categories:["Going Above & Beyond","Team Player","Innovation & Initiative","Customer Champion","Unsung Hero"],
      support:"support@viberecognition.co.uk",
    }
  },
  expiring: {
    license: { key:"VIBE-B9D1-4A2F-CC83-7E0B", expiresAt: futureDate(9) },
    brand: {
      slug:"acme-corp", businessName:"Acme Corporation",
      logoUrl:"https://placehold.co/160x48/1a1a2e/ffffff?text=ACME+CORP",
      primaryColor:"#1a1a2e", accentColor:"#e94560",
      tagline:"Recognising the people who make us great",
      categories:["Going Above & Beyond","Team Player","Innovation & Initiative","Customer Champion","Unsung Hero"],
      support:"support@viberecognition.co.uk",
    }
  },
  expired: {
    license: { key:"VIBE-C4E8-1B7A-F239-5D6C", expiresAt: futureDate(-45) },
    brand: {
      slug:"acme-corp", businessName:"Acme Corporation",
      logoUrl:"https://placehold.co/160x48/1a1a2e/ffffff?text=ACME+CORP",
      primaryColor:"#1a1a2e", accentColor:"#e94560",
      tagline:"Recognising the people who make us great",
      categories:[], support:"support@viberecognition.co.uk",
    }
  },
  "brand-b": {
    license: { key:"VIBE-D7F3-2C9E-A841-6B0D", expiresAt: futureDate(180) },
    brand: {
      slug:"horizon-retail", businessName:"Horizon Retail Group",
      logoUrl:"https://placehold.co/160x48/0d4f3c/ffffff?text=HORIZON",
      primaryColor:"#0d4f3c", accentColor:"#f5a623",
      tagline:"Great teams deserve great recognition",
      categories:["Star Performer","Customer Hero","Rising Star","Team Glue","Leadership Award"],
      support:"support@viberecognition.co.uk",
    }
  },
};

// Per-business employee directories (keyed by slug, loaded from CSV)
const directories = {
  "acme-corp": [],
  "horizon-retail": [],
};

const sampleEmployees = [
  { name:"Sarah Johnson",   email:"sarah.johnson@acme.com",   dept:"Marketing" },
  { name:"James Lee",       email:"james.lee@acme.com",       dept:"Engineering" },
  { name:"Priya Patel",     email:"priya.patel@acme.com",     dept:"HR" },
  { name:"Marcus Williams", email:"marcus.w@acme.com",        dept:"Sales" },
  { name:"Emma Clarke",     email:"emma.clarke@acme.com",     dept:"Operations" },
  { name:"Daniel Osei",     email:"d.osei@acme.com",          dept:"Finance" },
  { name:"Chloe Turner",    email:"chloe.t@acme.com",         dept:"Design" },
  { name:"Raj Sharma",      email:"raj.sharma@acme.com",      dept:"Engineering" },
  { name:"Amelia Brooks",   email:"a.brooks@acme.com",        dept:"Customer Success" },
  { name:"Tom Nguyen",      email:"tom.nguyen@acme.com",      dept:"Marketing" },
];

// ── State ─────────────────────────────────────────────
let currentScenario = "valid";
let formData = { nomineeName:"", nomineeEmail:"", nominatorName:"", nominatorEmail:"", category:"", reason:"" };
let autocompleteIndex = -1;

// ══════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════

function futureDate(days) {
  const d = new Date(); d.setDate(d.getDate() + days); return d.toISOString();
}
function formatDate(iso) {
  return new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
}
function validateLicense(lic) {
  const now = new Date(), exp = new Date(lic.expiresAt);
  if (now > exp) return { valid:false, reason:"license_expired", expiredAt:exp };
  const days = Math.ceil((exp - now) / 86400000);
  return { valid:true, daysRemaining:days, warning: days <= 14 };
}
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ══════════════════════════════════════════════════════
// DIRECTORY
// ══════════════════════════════════════════════════════

function currentDirectory() {
  const slug = scenarios[currentScenario].brand.slug;
  return directories[slug] || [];
}

function updateDirCount() {
  const n = currentDirectory().length;
  document.getElementById("dir-count").textContent =
    n === 0 ? "No employees loaded" : `${n} employee${n===1?"":"s"} loaded`;
}

function loadSampleDirectory() {
  const slug = scenarios[currentScenario].brand.slug;
  directories[slug] = [...sampleEmployees];
  updateDirCount();
  document.getElementById("csv-panel").style.display = "none";
  // Re-render form to pick up directory
  loadScenario(currentScenario);
}

function toggleCSVPanel() {
  const p = document.getElementById("csv-panel");
  p.style.display = p.style.display === "none" ? "block" : "none";
}

function importCSV() {
  const raw = document.getElementById("csv-input").value.trim();
  if (!raw) return;
  const slug = scenarios[currentScenario].brand.slug;
  const rows = raw.split("\n").map(r => r.split(",").map(c => c.trim()));
  const employees = rows
    .filter(r => r.length >= 2 && r[0] && r[1])
    .map(r => ({ name:r[0], email:r[1], dept:r[2]||"" }));
  directories[slug] = employees;
  updateDirCount();
  document.getElementById("csv-panel").style.display = "none";
  loadScenario(currentScenario);
}

function searchEmployees(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase();
  return currentDirectory()
    .filter(e => e.name.toLowerCase().includes(q) || e.email.toLowerCase().includes(q))
    .slice(0, 6);
}

// ══════════════════════════════════════════════════════
// AUTOCOMPLETE LOGIC
// ══════════════════════════════════════════════════════

function onNomineeNameInput(value) {
  formData.nomineeName = value;
  formData.nomineeEmail = ""; // clear on new typing
  clearError("nomineeName");

  // Unlock email field if cleared
  const emailInput = document.getElementById("f-nomineeEmail");
  if (emailInput) {
    emailInput.value = "";
    emailInput.readOnly = false;
    emailInput.style.background = "";
    const badge = document.getElementById("email-lock-badge");
    if (badge) badge.remove();
  }

  const results = searchEmployees(value);
  renderAutocompleteList(results, value);
}

function renderAutocompleteList(results, query) {
  closeAutocomplete();
  if (!results.length) return;

  const field = document.getElementById("autocomplete-anchor");
  if (!field) return;

  const list = document.createElement("div");
  list.className = "autocomplete-list";
  list.id = "autocomplete-list";

  results.forEach((emp, i) => {
    const item = document.createElement("div");
    item.className = "autocomplete-item";
    item.dataset.index = i;

    // Highlight matching portion
    const nameHl = emp.name.replace(
      new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`, "gi"),
      "<strong>$1</strong>"
    );
    item.innerHTML = `
      <span class="emp-dept">${escHtml(emp.dept)}</span>
      <div class="emp-name">${nameHl}</div>
      <div class="emp-email">${escHtml(emp.email)}</div>
    `;
    item.addEventListener("mousedown", (e) => {
      e.preventDefault();
      selectEmployee(emp);
    });
    list.appendChild(item);
  });

  field.appendChild(list);
  autocompleteIndex = -1;
}

function selectEmployee(emp) {
  // Fill name
  const nameInput = document.getElementById("f-nomineeName");
  if (nameInput) nameInput.value = emp.name;
  formData.nomineeName = emp.name;

  // Fill and lock email
  const emailInput = document.getElementById("f-nomineeEmail");
  if (emailInput) {
    emailInput.value = emp.email;
    emailInput.readOnly = true;
    emailInput.style.background = "#f0f7f0";
    emailInput.style.color = "#2a7a2a";

    // Add lock badge
    const existing = document.getElementById("email-lock-badge");
    if (!existing) {
      const badge = document.createElement("span");
      badge.id = "email-lock-badge";
      badge.className = "lock-badge";
      badge.textContent = "✓ Auto-filled from directory";
      emailInput.parentNode.appendChild(badge);
    }
  }
  formData.nomineeEmail = emp.email;

  closeAutocomplete();
  clearError("nomineeName");
  clearError("nomineeEmail");
}

function closeAutocomplete() {
  const el = document.getElementById("autocomplete-list");
  if (el) el.remove();
  autocompleteIndex = -1;
}

function handleNameKeydown(e) {
  const list = document.getElementById("autocomplete-list");
  if (!list) return;
  const items = list.querySelectorAll(".autocomplete-item");
  if (e.key === "ArrowDown") {
    e.preventDefault();
    autocompleteIndex = Math.min(autocompleteIndex + 1, items.length - 1);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    autocompleteIndex = Math.max(autocompleteIndex - 1, -1);
  } else if (e.key === "Enter" && autocompleteIndex >= 0) {
    e.preventDefault();
    const slug = scenarios[currentScenario].brand.slug;
    const results = searchEmployees(formData.nomineeName);
    if (results[autocompleteIndex]) selectEmployee(results[autocompleteIndex]);
    return;
  } else if (e.key === "Escape") {
    closeAutocomplete();
    return;
  }
  items.forEach((it, i) => it.classList.toggle("focused", i === autocompleteIndex));
}

// ══════════════════════════════════════════════════════
// SCENARIO LOADER
// ══════════════════════════════════════════════════════

function loadScenario(name) {
  currentScenario = name;
  formData = { nomineeName:"", nomineeEmail:"", nominatorName:"", nominatorEmail:"", category:"", reason:"" };

  document.querySelectorAll(".scenario-btn").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById("btn-" + name);
  if (btn) btn.classList.add("active");

  const { license, brand } = scenarios[name];
  const v = validateLicense(license);

  document.getElementById("frame-url").textContent =
    `https://recognition.vibeapp.co.uk/nominate/${brand.slug}`;

  document.getElementById("license-info").innerHTML = `
    <div><b>Key:</b> <span style="font-family:monospace;font-size:10px;">${license.key}</span></div>
    <div><b>Expires:</b> ${formatDate(license.expiresAt)}</div>
    ${v.valid
      ? `<div style="color:#4cde80"><b>${v.daysRemaining} days remaining</b></div>`
      : `<div style="color:#e94560"><b>EXPIRED</b></div>`}
  `;

  const dot = document.getElementById("status-dot");
  const txt = document.getElementById("status-text");
  dot.className = "status-dot";
  if (!v.valid) {
    dot.classList.add("dot-red");
    txt.textContent = "License expired — form blocked";
  } else if (v.warning) {
    dot.classList.add("dot-yellow");
    txt.textContent = `License valid — expires in ${v.daysRemaining} days`;
  } else {
    dot.classList.add("dot-green");
    txt.textContent = `License valid — ${v.daysRemaining} days remaining`;
  }

  updateDirCount();
  v.valid ? renderForm(brand, v) : renderExpired(brand, v);
}

// ══════════════════════════════════════════════════════
// RENDER: EXPIRED
// ══════════════════════════════════════════════════════

function renderExpired(brand, v) {
  document.getElementById("app-root").innerHTML = `
    <div class="expired-screen" style="background:linear-gradient(135deg,${brand.primaryColor} 0%,#2d2d5e 100%);">
      <img src="${brand.logoUrl}" style="height:44px;object-fit:contain;margin-bottom:24px;" />
      <div style="font-size:52px;margin-bottom:16px;">🔒</div>
      <div style="font-family:Georgia,serif;font-size:24px;color:white;margin-bottom:10px;">${escHtml(brand.businessName)}</div>
      <p style="font-size:14px;color:rgba(255,255,255,0.75);line-height:1.7;max-width:360px;">
        Your VIBE Recognition subscription has ended. New nominations are currently paused.
      </p>
      <p style="margin-top:20px;font-size:13px;color:rgba(255,255,255,0.5);">
        To renew your subscription please contact<br/>
        <a href="mailto:${escHtml(brand.support)}" style="color:rgba(255,255,255,0.8);">${escHtml(brand.support)}</a>
      </p>
      <div style="margin-top:32px;padding:12px 20px;background:rgba(255,255,255,0.08);border-radius:8px;font-size:12px;color:rgba(255,255,255,0.4);">
        Powered by VIBE Recognition
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════
// RENDER: FORM
// ══════════════════════════════════════════════════════

function renderForm(brand, v) {
  const hasDir = currentDirectory().length > 0;
  const catOptions = brand.categories.map(c =>
    `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join("");

// ══════════════════════════════════════════════════════
// FORM LOGIC
// ══════════════════════════════════════════════════════

function updateField(f, v) {
  formData[f] = v;
  clearError(f);
}
function clearError(f) {
  const el = document.getElementById("e-" + f); if (el) el.textContent = "";
  const inp = document.getElementById("f-" + f); if (inp) inp.classList.remove("err");
}
function setError(f, msg) {
  const el = document.getElementById("e-" + f); if (el) el.textContent = msg;
  const inp = document.getElementById("f-" + f); if (inp) inp.classList.add("err");
}

function validate() {
  const errs = {};
  if (!formData.nomineeName.trim()) errs.nomineeName = "Required";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.nomineeEmail)) errs.nomineeEmail = "Valid email required";
  if (!formData.category) errs.category = "Please select a category";
  if (formData.reason.trim().length < 10) errs.reason = "Please write at least a sentence";
  if (formData.nominatorEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.nominatorEmail))
    errs.nominatorEmail = "Valid email required";
  return errs;
}

function handlePreview() {
  const errs = validate();
  if (Object.keys(errs).length) {
    Object.keys(errs).forEach(f => setError(f, errs[f]));
    return;
  }
  renderPreview(scenarios[currentScenario].brand);
}

// ══════════════════════════════════════════════════════
// LICENSE KEY GENERATOR
// ══════════════════════════════════════════════════════

function seg() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i=0;i<4;i++) s += c[Math.floor(Math.random()*c.length)];
  return s;
}
function generateNewKey() {
  const key = `VIBE-${seg()}-${seg()}-${seg()}-${seg()}`;
  const exp = new Date(); exp.setFullYear(exp.getFullYear()+1);
  document.getElementById("new-key-output").innerHTML =
    `<div style="margin-bottom:3px;font-family:monospace;">${key}</div>
     <div style="color:#888;">Exp: ${exp.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</div>`;
}
